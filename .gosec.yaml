# G404 Insecure random number source (CWE-338)  [2]
#   internal/backoff/backoff.go                        1
#   internal/models/comment_read_test.go               1
#   Reason: Neither draw is a secret and neither feeds a security decision. The
#     internal/backoff one is the full-jitter retry delay: math/rand/v2 draws the
#     wait before each retry uniformly between zero and the ceiling then in force
#     (SPEC/IMPLEMENTATION.md § Retry Logic). What that shape needs is draws
#     INDEPENDENT of one another, so that concurrent losers of a serialisation
#     conflict do not re-send in step and keep the contending set saturated; it
#     does not need draws an adversary cannot predict, and an adversary who could
#     predict one would learn only how long a retry slept. crypto/rand would make
#     every retry in the binary depend on the entropy pool and would buy nothing.
#     The internal/models one builds a differential-test corpus from a fixed seed
#     so a failure is reproducible. No key, token, identifier or security decision
#     derives from either.
