#
# TWO OBSERVATIONS THIS REGISTER MAKES DELIBERATELY, because a reviewer who
# trusts the list should also know what the list does not mean.
#
# A suppression is not evidence that gosec had a finding. Of the 59 rules
# suppressed outside test files, 37 suppress a reported finding and 22 currently
# suppress nothing: gosec's G201 does not follow fmt.Sprintf through a query
# issued on the embedded *sql.DB or through a function that only returns the
# assembled string, G104 does not report an error discarded by an explicit
# `_ =` or returned by a deferred call, and the G703 half of the two-rule
# directive on internal/graphstore/graphstore.go's checkpoint chmod has no
# finding at that node. Those 22 are documentation at the site rather than an
# accepted finding.
# They are kept and listed because they are still standing scope-limited
# suppressions: if the rule starts reporting at that node, they will silence it.
#
# The split is MEASURED rather than counted by hand, and it is reproducible:
# `gosec -nosec=true -exclude-dir=.claude/worktrees ./...` disables suppression
# handling and reports 37 issues where the ordinary run reports 0.
#
# A #nosec is a permanent blindfold over one node. Every G201 line above means
# that if the statement at that site is ever edited to interpolate a value
# instead of a placeholder, the scanner will not say so. That is the cost being
# accepted, and it is the reason each entry names what makes it safe rather than
# only asserting that it is.
#
# One entry goes further, and it is the model for the rest. db/migrations.go
# columnExists is the only site that interpolates a value, and its reason names a
# guard in the code instead of a habit of its callers. That is a reason a
# reviewer can CHECK — read the guard, read the test that removes it — rather
# than one they must take on trust. Where a suppression can be backed that way,
# it should be.
