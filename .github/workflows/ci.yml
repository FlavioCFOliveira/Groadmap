name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run go fmt
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      # The linter binary is pinned, not just the action: an unpinned linter can
      # fail this job on a release nothing in the repository asked for. See
      # SPEC/BUILD.md § Validation Gates. The `version` input is a copy of the
      # Makefile's GOLANGCI_LINT_VERSION, and the action pin is the same in both
      # workflows (SPEC/BUILD.md § Static Analysis).
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Run tests
        run: go test -v -race -timeout=30m -coverprofile=coverage.out ./...

      # Reporting, not a gate: its failure must not fail the job.
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false

      # gosec is pinned to the Makefile's GOSEC_VERSION, of which this command
      # holds a copy (SPEC/BUILD.md § Static Analysis), so the rule set, the
      # scanned scope and the accepted #nosec suppressions are identical here,
      # in the release workflow and in a local `make check`. A failure to
      # install fails the job: the gate is never skipped.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        run: gosec -exclude-dir=.claude/worktrees ./...

  # Not a validation gate: the end-to-end suite runs beside the gate job, and
  # the build job needs both, so no artefact is built from a commit whose suite
  # did not pass. The binary under test is built in this job, in a step of its
  # own, and restored from no cache and no artefact. See SPEC/BUILD.md § The
  # End-to-End Suite Is a Required Pipeline Job; the python-version input is
  # the same in both workflows.
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Build rmp
        run: go build -o ./bin/rmp ./cmd/rmp

      # -u keeps the harness's announcement of each module unbuffered, so a job
      # cut off by its timeout still shows the module that was running.
      - name: Run end-to-end tests
        run: python3 -u tests/run_tests.py

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, e2e]
    # A compile and stamp check of a fast-feedback subset of four targets, not
    # a statement about portability: the binary it builds never leaves the
    # job, and this workflow publishes nothing. Every Primary Platform in
    # SPEC/BUILD.md § Supported Build Targets is compiled on each run by
    # TestSupportedBuildTargetsCompile in the test job above, which this job
    # depends on, and all of them are built and shipped by the release
    # workflow.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          # No -X main.version here: cmd/rmp/main.go declares version as a
          # const, and the linker's -X writes only to a package-level var, so
          # the flag was silently ignored. SPEC/VERSION.md makes that constant
          # the single source of the version.
          # -buildvcs=true fails a build that finds the repository but cannot
          # record its commit, instead of writing a binary that reports
          # "(commit unknown)". See SPEC/DEPLOY.md § How a Released Binary
          # Carries Its Commit.
          ldflags="-s -w"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            ldflags="${ldflags} -extldflags '-static'"
          fi
          go build -trimpath -buildvcs=true -ldflags="${ldflags}" -o "dist/rmp" ./cmd/rmp
          echo "Built ${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Check build stamp
        run: |
          # -buildvcs=true cannot stop a build that finds no repository at all,
          # so the stamp is checked on the binary itself, after the build. This
          # job is a compile and stamp check: the binary is neither packed nor
          # uploaded. `go version -m` exits 0 for an unstamped binary, so the
          # step decides on its output. See SPEC/DEPLOY.md § How a Released
          # Binary Carries Its Commit.
          binary="dist/rmp"
          buildinfo=$(go version -m "${binary}")
          if ! grep -Eq '^[[:space:]]+build[[:space:]]+vcs\.revision=' <<< "${buildinfo}"; then
            echo "${binary} carries no vcs.revision build setting, so it cannot name the commit it was built from; the job stops before the binary leaves it." >&2
            exit 1
          fi
