name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run go fmt
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      # The linter binary is pinned, not just the action: an unpinned linter can
      # fail this job on a release nothing in the repository asked for. See
      # SPEC/BUILD.md § Validation Gates. The `version` input is a copy of the
      # Makefile's GOLANGCI_LINT_VERSION, and the action pin is the same in both
      # workflows (SPEC/BUILD.md § Static Analysis).
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Run tests
        run: go test -v -race -timeout=30m ./...

      # gosec is pinned to the Makefile's GOSEC_VERSION, of which this command
      # holds a copy (SPEC/BUILD.md § Static Analysis), so the rule set, the
      # scanned scope and the accepted #nosec suppressions are identical here,
      # in CI and in a local `make check`. A failure to install fails the job:
      # the gate is never skipped.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        run: gosec -exclude-dir=.claude/worktrees ./...

  # Not a validation gate: the end-to-end suite runs beside the gate job, and
  # the build job needs both, so no artefact is built from a commit whose suite
  # did not pass. The binary under test is built in this job, in a step of its
  # own, and restored from no cache and no artefact. See SPEC/BUILD.md § The
  # End-to-End Suite Is a Required Pipeline Job; the python-version input is
  # the same in both workflows.
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Build rmp
        run: go build -o ./bin/rmp ./cmd/rmp

      # -u keeps the harness's announcement of each module unbuffered, so a job
      # cut off by its timeout still shows the module that was running.
      - name: Run end-to-end tests
        run: python3 -u tests/run_tests.py

  build:
    name: Build Release Binaries
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # This matrix is the full set of Primary Platforms in
    # SPEC/BUILD.md § Supported Build Targets, in the same order. Every entry
    # defines goarm, empty where the target has no GOARM level, so each
    # expression below that reads matrix.goarm names a defined property.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goarm: ""
          - goos: linux
            goarch: arm64
            goarm: ""
          - goos: darwin
            goarch: amd64
            goarm: ""
          - goos: darwin
            goarch: arm64
            goarm: ""
          - goos: windows
            goarch: amd64
            goarm: ""
          - goos: windows
            goarch: arm64
            goarm: ""
          - goos: freebsd
            goarch: amd64
            goarm: ""
          - goos: openbsd
            goarch: amd64
            goarm: ""
          - goos: openbsd
            goarch: arm64
            goarm: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          # No -X main.version here: cmd/rmp/main.go declares version as a
          # const, and the linker's -X writes only to a package-level var, so
          # the flag was silently ignored -- the tag never reached the binary.
          # SPEC/VERSION.md makes that constant the single source of the
          # version, bumped as part of the release procedure.
          # -buildvcs=true fails a build that finds the repository but cannot
          # record its commit, instead of writing a binary that reports
          # "(commit unknown)". See SPEC/DEPLOY.md § How a Released Binary
          # Carries Its Commit.
          ldflags="-s -w"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            ldflags="${ldflags} -extldflags '-static'"
          fi
          # Windows executables need the .exe suffix to be runnable, and
          # install.sh expects that name inside the archive.
          binary="rmp"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary="rmp.exe"
          fi
          go build -trimpath -buildvcs=true -ldflags="${ldflags}" -o "dist/${binary}" ./cmd/rmp
          if [ -n "${{ matrix.goarm }}" ]; then
            echo "Built ${{ matrix.goos }}/${{ matrix.goarch }}v${{ matrix.goarm }}"
          else
            echo "Built ${{ matrix.goos }}/${{ matrix.goarch }}"
          fi

      - name: Check build stamp
        run: |
          # -buildvcs=true cannot stop a build that finds no repository at all,
          # so the stamp is checked on the binary itself before it is packed and
          # uploaded. `go version -m` exits 0 for an unstamped binary, so the
          # step decides on its output. See SPEC/DEPLOY.md § How a Released
          # Binary Carries Its Commit.
          binary="dist/rmp"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary="dist/rmp.exe"
          fi
          buildinfo=$(go version -m "${binary}")
          if ! grep -Eq '^[[:space:]]+build[[:space:]]+vcs\.revision=' <<< "${buildinfo}"; then
            echo "${binary} carries no vcs.revision build setting, so it cannot name the commit it was built from; the job stops before the binary leaves it." >&2
            exit 1
          fi

      - name: Create archive
        id: create_archive
        run: |
          version="${{ steps.get_version.outputs.VERSION }}"
          goos="${{ matrix.goos }}"
          goarch="${{ matrix.goarch }}"
          goarm="${{ matrix.goarm }}"

          if [ -n "${goarm}" ]; then
            arch_suffix="${goarch}v${goarm}"
          else
            arch_suffix="${goarch}"
          fi

          # SPEC/BUILD.md § Artifact Structure: an archive carries three entries
          # -- the binary, the LICENSE, and the README.md quick-start guide.
          # They are copied into dist/ first so both branches pack from one
          # directory and the entries stay flat, with no leading path component
          # for the installer to strip.
          cp LICENSE README.md dist/

          # Archive format per SPEC/BUILD.md § Release Workflow ("or .zip for
          # Windows") and SPEC/DEPLOY.md § Build Matrix: Windows ships a .zip
          # holding rmp.exe, every other target a .tar.gz holding rmp. The name
          # follows rmp-{version}-{target}.{ext} in both cases.
          if [ "${goos}" = "windows" ]; then
            archive_name="rmp-${version}-${goos}-${arch_suffix}.zip"
            (cd dist && zip -q "${archive_name}" rmp.exe LICENSE README.md)
          else
            archive_name="rmp-${version}-${goos}-${arch_suffix}.tar.gz"
            tar -czf "dist/${archive_name}" -C dist rmp LICENSE README.md
          fi
          echo "ARCHIVE=${archive_name}" >> $GITHUB_OUTPUT

      - name: Generate checksum
        run: |
          cd dist
          sha256sum ${{ steps.create_archive.outputs.ARCHIVE }} > ${{ steps.create_archive.outputs.ARCHIVE }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: |
            dist/${{ steps.create_archive.outputs.ARCHIVE }}
            dist/${{ steps.create_archive.outputs.ARCHIVE }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist/

      # SPEC/SKILLS.md § Packaging: the agent skills ship as one archive and its
      # checksum, built here from this job's checkout of the tag, before the
      # release is created. The archive's top-level entries are exactly
      # roadmap-manager/ and knowledge-authority/, with no leading ./; it holds
      # each skill's file set (every regular file, recursively, except paths
      # with a component beginning with '.') and the directories that contain
      # it, and nothing else. The checksum is sha256sum's own output, run from
      # inside dist/ exactly as for a binary archive, so the next step attaches
      # both files by the same dist/*.tar.gz and dist/*.sha256 rule.
      - name: Package agent skills
        run: |
          set -euo pipefail
          version="${{ steps.get_version.outputs.VERSION }}"
          archive="rmp-skills-${version}.tar.gz"

          for skill in roadmap-manager knowledge-authority; do
            if [ -L "skills/${skill}" ] || [ ! -d "skills/${skill}" ]; then
              echo "skills/${skill} is missing, so the release cannot publish the agent skills." >&2
              exit 1
            fi
          done

          # A link, a device or any other entry that is neither a directory nor
          # a regular file is never shipped; one in a skill fails the job rather
          # than being dropped silently.
          unsupported=$(cd skills && find roadmap-manager knowledge-authority \
            -name '.*' -prune -o ! -type d ! -type f -print)
          if [ -n "${unsupported}" ]; then
            echo "skills/ holds entries that are neither directories nor regular files:" >&2
            echo "${unsupported}" >&2
            exit 1
          fi

          entries="$(mktemp)"
          (cd skills && find roadmap-manager knowledge-authority \
            -name '.*' -prune -o \( -type d -o -type f \) -print | LC_ALL=C sort) > "${entries}"
          tar --no-recursion -czf "dist/${archive}" -C skills -T "${entries}"
          rm -f "${entries}"

          (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          tar -tzf "dist/${archive}"
          (cd dist && sha256sum -c "${archive}.sha256")

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.get_version.outputs.VERSION }}"
          shopt -s nullglob
          # Windows targets ship .zip, every other target .tar.gz; both must be
          # attached to the release. nullglob above keeps a missing pattern from
          # being passed through literally.
          artifacts=(dist/*.tar.gz dist/*.zip dist/*.sha256)

          if gh release view "${version}" &>/dev/null; then
            echo "Release ${version} already exists. Uploading new artifacts..."
            for file in "${artifacts[@]}"; do
              gh release upload "${version}" "$file" --clobber
            done
          else
            gh release create "${version}" \
              --title "Release ${version}" \
              --generate-notes \
              --verify-tag \
              "${artifacts[@]}"
          fi
